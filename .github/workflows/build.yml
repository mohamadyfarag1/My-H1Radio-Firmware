name: Build Custom OpenWrt for H1Radio TI04-708HP

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages to install (e.g., luci luci-app-wireguard)'
        required: false
        default: 'luci'

jobs:
  build:
    name: Build OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Linux Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget device-tree-compiler python3-pip python3-m2crypto swig libelf-dev

      - name: Clone OpenWrt Source
        run: |
          git clone -b openwrt-24.10 https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Decompile and Patch Original Device Tree (DTS)
        run: |
          cd openwrt
          # We use the original router.dtb from the repo which contains the correct 128MB SPI NAND layout
          dts_path="target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-h1radio-ti04-708hp.dts"
          mkdir -p $(dirname "$dts_path")
          dtc -I dtb -O dts -o "$dts_path" ../router.dtb
          
          # Patch the DTS to add the ath10k calibration variant for Wi-Fi
          python3 << 'PYEOF'
          import re
          path = "target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-h1radio-ti04-708hp.dts"
          with open(path, "r") as f:
              content = f.read()
              
          # Inject variant above compatible = "qcom,ath10k"
          content = re.sub(
              r'(compatible\s*=\s*"qcom,ath10k";)', 
              r'qcom,ath10k-calibration-variant = "8devices-Jalapeno";\n\t\t\t\1', 
              content
          )
          
          # Change Model Name
          content = re.sub(
              r'model\s*=\s*".*";', 
              r'model = "Horus 9200";', 
              content
          )
          
          with open(path, "w") as f:
              f.write(content)
          PYEOF
          
          # Also write to main dts dir to be safe
          main_dts="target/linux/ipq40xx/dts"
          mkdir -p "$main_dts"
          cp "$dts_path" "$main_dts/"
          
          echo "Original DTB decompiled and patched successfully."

      - name: Patch Makefiles for Custom Device
        run: |
          cd openwrt
          {
            printf '\n'
            printf 'define Device/h1radio_ti04-708hp\n'
            printf '\t$(call Device/FitImage)\n'
            printf '\t$(call Device/UbiFit)\n'
            printf '\tDEVICE_VENDOR := Horus\n'
            printf '\tDEVICE_MODEL := 9200\n'
            printf '\tSOC := qcom-ipq4019\n'
            printf '\tDEVICE_DTS := qcom-ipq4019-h1radio-ti04-708hp\n'
            printf '\tBLOCKSIZE := 128k\n'
            printf '\tPAGESIZE := 2048\n'
            printf '\tIMAGE_SIZE := 32768k\n'
            printf '\tDEVICE_PACKAGES := kmod-ath10k-ct ath10k-firmware-qca4019-ct -kmod-ath10k -ath10k-firmware-qca4019\n'
            printf 'endef\n'
            printf 'TARGET_DEVICES += h1radio_ti04-708hp\n'
          } >> target/linux/ipq40xx/image/generic.mk

      - name: Add Network and WiFi Defaults
        run: |
          cd openwrt
          mkdir -p package/base-files/files/etc/uci-defaults
          cat << 'EOF' > package/base-files/files/etc/uci-defaults/99-custom-network
          #!/bin/sh
          # Set hostname and UI theme
          uci set system.@system[0].hostname='Horus-9200'
          uci commit system
          uci set luci.main.mediaurlbase='/luci-static/openwrt2020'
          uci commit luci
          
          # Enable WiFi radios and set SSIDs
          uci -q set wireless.@wifi-device[0].disabled=0
          uci -q set wireless.@wifi-device[1].disabled=0
          uci -q set wireless.default_radio0.ssid='Horus-2.4'
          uci -q set wireless.default_radio1.ssid='Horus-5G'
          
          # 1. Force 5G to AC and disable disassoc_low_ack
          uci -q set wireless.radio1.require_mode='ac'
          uci -q set wireless.default_radio1.disassoc_low_ack='0'
          uci commit wireless
          wifi
          
          # 2 & 3. Inject bitrates lock into rc.local directly during build
          cat << 'RCLOCAL' > package/base-files/files/etc/rc.local
          # Put your custom commands here that should be executed once
          # the system init finished. By default this file does nothing.
          
          # Force 5GHz to high bitrates to prevent slow connections
          for iface in $(iw dev | grep -B 1 "phy#1" -A 2 | grep Interface | awk '{print $2}'); do
              iw dev "$iface" set bitrates vht-mcs-5 1:2-9 2:1-9 3:1-9 4:0-9
          done
          
          exit 0
          RCLOCAL
          chmod +x package/base-files/files/etc/rc.local
          
          # Setup DSA bridge dynamically for all available ports
          uci -q delete network.@device[0]
          uci set network.br_lan=device
          uci set network.br_lan.name='br-lan'
          uci set network.br_lan.type='bridge'
          for iface in lan1 lan2 lan3 lan4 eth0 eth1 eth2; do
              if ip link show "$iface" >/dev/null 2>&1; then
                  uci add_list network.br_lan.ports="$iface"
              fi
          done
          
          uci set network.lan=interface
          uci set network.lan.device='br-lan'
          uci set network.lan.proto='static'
          uci set network.lan.ipaddr='192.168.100.1'
          uci set network.lan.netmask='255.255.255.0'
          uci set dhcp.lan.ignore='1'
          uci set network.lan.ipv6='0'
          
          # Disable IPv6 on the bridge (UI option)
          uci set network.br_lan.ipv6='0'
          
          # Disable IPv6 DHCP (RA/DHCPv6)
          uci -q set dhcp.lan.dhcpv6='disabled'
          uci -q set dhcp.lan.ra='disabled'
          uci -q set dhcp.lan.ndp='disabled'
          /etc/init.d/odhcpd disable 2>/dev/null || true
          
          # Enable Packet Steering to distribute CPU load across all cores
          uci set network.@globals[0].packet_steering='1'
          
          uci commit network
          /etc/init.d/network restart
          
          # Ensure irqbalance is enabled and started
          /etc/init.d/irqbalance enable
          /etc/init.d/irqbalance start
          
          exit 0
          EOF
          chmod +x package/base-files/files/etc/uci-defaults/99-custom-network
      - name: Patch platform.sh for sysupgrade support
        run: |
          cd openwrt
          python3 << 'PYEOF'
          path = "target/linux/ipq40xx/base-files/lib/upgrade/platform.sh"
          with open(path, "r") as f:
              content = f.read()
          content = content.replace(
              "wallys,dr40x9)",
              "h1radio,ti04-708hp |\\\n\twallys,dr40x9)"
          )
          with open(path, "w") as f:
              f.write(content)
          print("OK: h1radio added to nand_do_upgrade in platform.sh")
          PYEOF
          
          # Inject original Wi-Fi calibration file (board-2.bin) and firmware (firmware-5.bin)
          if [ -f "../board-2.bin" ]; then
            echo "Found original board-2.bin, injecting it for Wi-Fi calibration..."
            mkdir -p package/base-files/files/lib/firmware/ath10k/QCA4019/hw1.0/
            cp ../board-2.bin package/base-files/files/lib/firmware/ath10k/QCA4019/hw1.0/board-2.bin
          else
            echo "WARNING: board-2.bin not found in repository root!"
          fi
          
          if [ -f "../firmware-5.bin" ]; then
            echo "Found original firmware-5.bin, injecting it..."
            mkdir -p package/base-files/files/lib/firmware/ath10k/QCA4019/hw1.0/
            cp ../firmware-5.bin package/base-files/files/lib/firmware/ath10k/QCA4019/hw1.0/firmware-5.bin
          fi
          
      - name: Compile the Firmware
        run: |
          grep -B 1 -A 1 'h1radio' target/linux/ipq40xx/base-files/lib/upgrade/platform.sh || true

      - name: Create Superchannel Unlock Script
        run: |
          cat > /tmp/unlock-superchannel.sh << 'SEDSCRIPT'
          #!/bin/bash
          echo "============================================"
          echo "=== SUPERCHANNEL UNLOCK - Full Spectrum ==="
          echo "============================================"

          #############################################
          # PATCH 1: ath/regd.c (Kernel Regulatory)
          # Based on forum post #3 by anarchy99
          # Expands 2GHz to 2192-2732 MHz
          # Expands 5GHz to 4900-6100 MHz
          # Removes NO_IR and NO_OFDM restrictions
          #############################################
          for REGD in $(find . -path "*/drivers/net/wireless/ath/regd.c" 2>/dev/null); do
            echo "[PATCH 1] Patching: $REGD"
            # 2GHz CH01-11 rule: expand to full 2.3GHz band
            sed -i 's/REG_RULE(2412-10, 2462+10, 40, 0, 20, 0)/REG_RULE(2192-10, 2732+10, 40, 0, 30, 0)/g' "$REGD"
            # 2GHz CH12-13 rule: expand to full band
            sed -i 's/REG_RULE(2467-10, 2472+10, 40, 0, 20,/REG_RULE(2192-10, 2732+10, 40, 0, 30,/g' "$REGD"
            # 2GHz CH14 rule: increase power
            sed -i 's/REG_RULE(2484-10, 2484+10, 40, 0, 20,/REG_RULE(2484-10, 2484+10, 40, 0, 30,/g' "$REGD"
            # 5GHz first range: expand to full 5GHz
            sed -i 's/REG_RULE(5150-10, 5350+10, 80, 0, 30,/REG_RULE(4900-10, 6100+10, 160, 0, 30,/g' "$REGD"
            # 5GHz second range: expand to full 5GHz
            sed -i 's/REG_RULE(5470-10, 5850+10, 80, 0, 30,/REG_RULE(4900-10, 6100+10, 160, 0, 30,/g' "$REGD"
            # 5GHz third range: expand to full 5GHz
            sed -i 's/REG_RULE(5725-10, 5850+10, 80, 0, 30,/REG_RULE(4900-10, 6100+10, 160, 0, 30,/g' "$REGD"
            # Remove NO_IR (No Initiate Radiation) - allow active scan
            sed -i 's/NL80211_RRF_NO_IR/0/g' "$REGD"
            # Remove NO_OFDM restriction - allow OFDM on all channels
            sed -i 's/NL80211_RRF_NO_OFDM/0/g' "$REGD"
            echo "  -> ath/regd.c patched OK"
          done

          #############################################
          # PATCH 2: net/wireless/reg.c
          # Based on forum post #3
          # Expands world regdomain 00
          # Removes is_valid_rd() checks completely
          #############################################
          for REG in $(find . -path "*/net/wireless/reg.c" 2>/dev/null); do
            echo "[PATCH 2] Patching: $REG"
            # Expand world regdomain 00 - 2GHz
            sed -i 's/REG_RULE(2412-10, 2462+10, 40, 6, 20, 0)/REG_RULE(2192-10, 2732+10, 40, 6, 30, 0)/g' "$REG"
            # Remove CH12-13 separate rule (now covered by expanded range)
            sed -i 's/REG_RULE(2467-10, 2472+10, 20, 6, 20,/REG_RULE(2192-10, 2732+10, 40, 6, 30,/g' "$REG"
            # Expand CH14 power
            sed -i 's/REG_RULE(2484-10, 2484+10, 20, 6, 20,/REG_RULE(2484-10, 2484+10, 40, 6, 30,/g' "$REG"
            # Remove ALL is_valid_rd() validation blocks (3 locations in the forum patch)
            # Location 1: reg_set_rd_user
            sed -i '/if (!is_valid_rd(rd)) {/{N;N;N;N;d}' "$REG"
            # Location 2: WARN version
            sed -i '/if (WARN(!is_valid_rd(rd)/{N;N;N;d}' "$REG"
            # Remove NO_IR flags from world regdomain
            sed -i 's/NL80211_RRF_NO_IR | NL80211_RRF_AUTO_BW/0/g' "$REG"
            sed -i 's/NL80211_RRF_NO_IR/0/g' "$REG"
            sed -i 's/NL80211_RRF_NO_OFDM/0/g' "$REG"
            echo "  -> net/wireless/reg.c patched OK"
          done

          #############################################
          # PATCH 3: net/wireless/util.c
          # CRITICAL for 2.3GHz support!
          # Adds support for channel numbers > 127
          # Without this, extended channels won't work
          #############################################
          for UTIL in $(find . -path "*/net/wireless/util.c" 2>/dev/null); do
            echo "[PATCH 3] Patching: $UTIL"
            # Add signed char cast for extended channel numbers
            # This allows channels 213-255 (2.3GHz band) to work
            sed -i '/case NL80211_BAND_2GHZ:/a\\t\tchan = (int)(char)chan;' "$UTIL"
            echo "  -> net/wireless/util.c patched OK"
          done

          #############################################
          # PATCH 4: hostapd - hw_features.c
          # Allow OFDM/HT/VHT on channel 14
          # Without this, channel 14 is B-only
          #############################################
          for HWF in $(find . -path "*/hostapd*/src/ap/hw_features.c" -o -path "*/wpad*/src/ap/hw_features.c" 2>/dev/null); do
            echo "[PATCH 4] Patching: $HWF"
            # Remove the block that disables OFDM/HT/VHT on channel 14
            sed -i 's/wpa_printf(MSG_INFO, "Disable OFDM\/HT\/VHT on channel 14");//g' "$HWF"
            sed -i 's/iface->conf->hw_mode = HOSTAPD_MODE_IEEE80211B;/iface->conf->hw_mode = HOSTAPD_MODE_IEEE80211G;/g' "$HWF"
            sed -i '/iface->conf->ieee80211n = 0;/d' "$HWF"
            sed -i '/iface->conf->ieee80211ac = 0;/d' "$HWF"
            echo "  -> hostapd/hw_features.c patched OK"
          done

          echo "============================================"
          echo "=== SUPERCHANNEL UNLOCK COMPLETE ==="
          echo "============================================"
          SEDSCRIPT
          chmod +x /tmp/unlock-superchannel.sh

      - name: Generate Custom Unlocked Regulatory DB
        run: |
          git clone https://git.kernel.org/pub/scm/linux/kernel/git/sforshee/wireless-regdb.git || true
          cd wireless-regdb
          python3 -c "
          # Generate db.txt with ALL countries unlocked
          countries = [
              '00',
              'AD','AE','AF','AL','AM','AN','AR','AT','AU','AW','AZ',
              'BA','BB','BD','BE','BG','BH','BL','BN','BO','BR','BY',
              'CA','CF','CH','CI','CL','CN','CO','CR','CY','CZ',
              'DE','DK','DO','DZ',
              'EC','EE','EG','ES','ET',
              'FI','FR',
              'GB','GE','GH','GL','GP','GR','GT','GU','GY',
              'HK','HN','HR','HT','HU',
              'ID','IE','IL','IN','IQ','IR','IS','IT',
              'JM','JO','JP',
              'KE','KH','KN','KP','KR','KW','KY','KZ',
              'LB','LC','LI','LK','LS','LT','LU','LV',
              'MA','MC','MD','ME','MF','MH','MK','MN','MO','MP','MQ','MR','MT','MU','MW','MX','MY',
              'NG','NI','NL','NO','NP','NZ',
              'OM',
              'PA','PE','PF','PG','PH','PK','PL','PM','PR','PT','PW','PY',
              'QA',
              'RE','RO','RS','RU','RW',
              'SA','SE','SG','SI','SK','SN','SR','SV','SY',
              'TC','TD','TG','TH','TN','TR','TT','TW','TZ',
              'UA','UG','US','UY','UZ',
              'VC','VE','VI','VN','VU',
              'WF','WS',
              'YE','YT',
              'ZA','ZW'
          ]
          with open('db.txt', 'w') as f:
              for c in countries:
                  if c == '00':
                      f.write('country 00:\n')
                  else:
                      f.write(f'country {c}:\n')
                  f.write('\t(2192 - 2732 @ 40), (30)\n')
                  f.write('\t(4900 - 6100 @ 160), (30)\n')
                  f.write('\n')
          print(f'Generated db.txt with {len(countries)} countries')
          "
          openssl ecparam -name prime256v1 -genkey -noout -out key.priv.pem
          make || echo "WARNING: regulatory.db build failed, using repo copy"

      - name: Inject Custom Board Data and Regulatory and UCI Defaults
        run: |
          cd openwrt
          mkdir -p files/lib/firmware/ath10k/QCA4019/hw1.0/
          cp ../board-2.bin files/lib/firmware/ath10k/QCA4019/hw1.0/board-2.bin
          if [ -f ../wireless-regdb/regulatory.db ]; then
            cp ../wireless-regdb/regulatory.db files/lib/firmware/regulatory.db
            echo "Using freshly built regulatory.db"
          elif [ -f ../regulatory.db ]; then
            cp ../regulatory.db files/lib/firmware/regulatory.db
            echo "Using existing regulatory.db from repo"
          fi
          cp -r ../files_ap/* files/
          chmod +x files/etc/uci-defaults/*

          # ============================================
          # Passive ARP Sniffer (UBNT-like IP+Host discovery)
          # ============================================
          mkdir -p files/usr/bin files/etc/init.d files/etc/uci-defaults
          cat << 'EOF' > files/usr/bin/passive-ip-sniffer.sh
          #!/bin/sh
          # Dual Passive Sniffer (ARP + DHCP) for Bridge Mode AP
          LEASES="/tmp/dhcp.leases"
          sleep 15
          touch "$LEASES"
          
          # 1. ARP Sniffer (Captures IP <-> MAC)
          tcpdump -i br-lan -l -n -e -t arp 2>/dev/null | awk '
          /Request who-has/ { ip=$4; mac=$6; gsub(/,/, "", mac); system("echo " ip " > /tmp/arp-ip-" tolower(mac)) }
          /Reply is-at/ { ip=$3; mac=$5; gsub(/,/, "", mac); system("echo " ip " > /tmp/arp-ip-" tolower(mac)) }
          ' &
          
          # 2. DHCP Sniffer (Captures Hostname <-> MAC)
          tcpdump -i br-lan -l -n -e -v udp port 67 or port 68 2>/dev/null | awk '
          /^[0-9:.]* ([0-9a-fA-F:]+) >/ { current_mac = tolower($2) }
          /Hostname/ && /"/ {
              s = $0; start = index(s, "\""); end = index(substr(s, start+1), "\"")
              if (start > 0 && end > 0 && current_mac != "") {
                  host = substr(s, start+1, end-1)
                  system("echo \"" host "\" > /tmp/dhcp-host-" current_mac)
              }
          }
          ' &
          
          # 3. Compiler: Merge into dhcp.leases
          while true; do
              > "$LEASES".new
              for ipfile in /tmp/arp-ip-*; do
                  [ -f "$ipfile" ] || continue
                  mac="${ipfile##*-}"
                  ip=$(cat "$ipfile")
                  host="*"
                  if [ -f "/tmp/dhcp-host-$mac" ]; then
                      host=$(cat "/tmp/dhcp-host-$mac")
                  else
                      # Fallback for Static IPs: Try fetching HTTP Title once
                      if [ ! -f "/tmp/http-host-$mac" ]; then
                          title=$(wget -qO- -T 2 "http://$ip/" 2>/dev/null | grep -i '<title>' | sed -n 's/.*<title>\(.*\)<\/title>.*/\1/ip' | head -1 | tr -d '\r\n')
                          if [ -n "$title" ]; then
                              echo "$title" > "/tmp/http-host-$mac"
                          else
                              echo "$ip" > "/tmp/http-host-$mac"
                          fi
                      fi
                      host=$(cat "/tmp/http-host-$mac")
                  fi
                  # Provide dummy lease time (1999999999) so LuCI shows it as active
                  echo "1999999999 $mac $ip $host *" >> "$LEASES".new
              done
              mv "$LEASES".new "$LEASES"
              sleep 5
          done &
          EOF
          chmod +x files/usr/bin/passive-ip-sniffer.sh
          
          cat << 'EOF' > files/etc/init.d/passive-arp
          #!/bin/sh /etc/rc.common
          START=99
          USE_PROCD=1
          PROG=/usr/bin/passive-ip-sniffer.sh
          start_service() {
              procd_open_instance
              procd_set_param command "$PROG"
              procd_set_param respawn 3600 5 0
              procd_close_instance
          }
          EOF
          chmod +x files/etc/init.d/passive-arp
          
          echo '#!/bin/sh' > files/etc/uci-defaults/99-enable-passive-arp
          echo '/etc/init.d/passive-arp enable' >> files/etc/uci-defaults/99-enable-passive-arp
          echo 'exit 0' >> files/etc/uci-defaults/99-enable-passive-arp
          chmod +x files/etc/uci-defaults/99-enable-passive-arp

          # Create helper script to extract real EEPROM calibration data after first boot
          mkdir -p files/usr/sbin
          cat > files/usr/sbin/extract-board-data << 'EXTRACTEOF'
          #!/bin/sh
          # Run this script via SSH after first boot to extract
          # the real calibration data from your device's flash
          echo "=== H1Radio Board Data Extractor ==="

          # Find the ART (calibration) partition
          ART_MTD=$(grep -i "art\|caldata\|radio\|0:ART" /proc/mtd | head -1 | cut -d: -f1)
          if [ -z "$ART_MTD" ]; then
            echo "ERROR: Could not find calibration partition!"
            echo "Available partitions:"
            cat /proc/mtd
            exit 1
          fi

          echo "Found calibration partition: /dev/$ART_MTD"
          dd if=/dev/$ART_MTD of=/tmp/art_backup.bin 2>/dev/null
          echo "Calibration data saved to /tmp/art_backup.bin"
          echo "Size: $(wc -c < /tmp/art_backup.bin) bytes"
          echo ""
          echo "To download it to your PC, use:"
          echo "  scp root@192.168.1.1:/tmp/art_backup.bin ."
          echo ""
          echo "=== Done ==="
          EXTRACTEOF
          chmod +x files/usr/sbin/extract-board-data

      - name: Update Feeds and Configure
        run: |
          cd openwrt
          ./scripts/feeds update -a || true
          ./scripts/feeds install -a || true
          
          # Inject Custom UI JS for MAC Copy and IP Click
          cat << 'JSEOF' >> feeds/luci/modules/luci-base/htdocs/luci-static/resources/luci.js
          document.addEventListener('DOMContentLoaded', function() {
              setInterval(function() {
                  var tables = document.querySelectorAll('.assoclist');
                  tables.forEach(function(table) {
                      var rows = table.querySelectorAll('.tr');
                      rows.forEach(function(row) {
                          if (row.dataset.enhanced) return;
                          var cells = row.querySelectorAll('.td');
                          if (cells.length >= 3) {
                              var macCell = cells[1];
                              var hostCell = cells[2];
                              var macMatch = macCell.innerText.match(/([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})/);
                              if (macMatch && !macCell.querySelector('.copy-mac-btn')) {
                                  var btn = document.createElement('button');
                                  btn.innerHTML = '&#128203;';
                                  btn.className = 'btn cbi-button cbi-button-apply copy-mac-btn';
                                  btn.style.marginLeft = '8px';
                                  btn.style.padding = '1px 4px';
                                  btn.style.fontSize = '12px';
                                  btn.title = 'Copy MAC Address';
                                  btn.onclick = function() {
                                      navigator.clipboard.writeText(macMatch[0]);
                                      var oldBg = btn.style.backgroundColor;
                                      btn.style.backgroundColor = '#4caf50';
                                      setTimeout(function(){ btn.style.backgroundColor = oldBg; }, 1000);
                                  };
                                  macCell.appendChild(btn);
                                  row.dataset.enhanced = "true";
                              }
                              var ipMatch = hostCell.innerText.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                              if (ipMatch && !hostCell.querySelector('a')) {
                                  var ip = ipMatch[0];
                                  hostCell.innerHTML = hostCell.innerHTML.replace(ip, '<a href="http://' + ip + '" target="_blank" style="font-weight:bold; color:#0069d6; text-decoration:underline;">' + ip + '</a>');
                                  row.dataset.enhanced = "true";
                              }
                          }
                      });
                  });
              }, 2000);
          });
          JSEOF
          
          # The target uses -ct by default or we specify it in .config, no need to sed Makefile
          cat > .config << 'CFGEOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_h1radio_ti04-708hp=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_PACKAGE_kmod-ath10k-ct=y
          CONFIG_PACKAGE_ath10k-firmware-qca4019-ct=y
          # CONFIG_PACKAGE_kmod-ath10k is not set
          # CONFIG_PACKAGE_ath10k-firmware-qca4019 is not set
          CONFIG_ATH_USER_REGD=y
          CONFIG_PACKAGE_ATH_USER_REGD=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_MAC80211_USER_REGD=y
          CONFIG_KERNEL_CFG80211_REQUIRE_SIGNED_REGDB=n
          CONFIG_KERNEL_CFG80211_CERTIFICATION_ONUS=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_tcpdump-mini=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_lldpd=y
          CONFIG_PACKAGE_luci-theme-openwrt-2020=y
          CFGEOF
          make defconfig

      - name: Download Dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware with Superchannel Patches
        run: |
          cd openwrt
          echo "======================================="
          echo "Step 1: Preparing kernel source..."
          echo "======================================="
          make target/linux/prepare V=s -j$(nproc) 2>&1 || true

          echo "======================================="
          echo "Step 1.5: Injecting DTS into kernel build tree..."
          echo "======================================="
          # DTS injection is now handled cleanly via files/ overlay.

          echo "======================================="
          echo "Step 2: Applying Superchannel Patches..."
          echo "======================================="
          cd build_dir
          bash /tmp/unlock-superchannel.sh
          cd ..

          echo "======================================="
          echo "Step 3: Starting Full Compilation..."
          echo "======================================="
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H1Radio_TI04-708HP_SuperFirmware
          path: openwrt/bin/targets/ipq40xx/generic/*
