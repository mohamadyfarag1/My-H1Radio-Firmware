name: Build Custom OpenWrt for H1Radio TI04-708HP

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages to install (e.g., luci luci-app-wireguard)'
        required: false
        default: 'luci'

jobs:
  build:
    name: Build OpenWrt
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Linux Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-cryptography python3-setuptools rsync unzip zlib1g-dev \
            file wget device-tree-compiler python3-m2crypto python3-future
            
      - name: Clone OpenWrt Source
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt
          
      - name: Decompile and Inject Device Tree
        run: |
          cd openwrt
          dtc -I dtb -O dts ../router.dtb > target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-h1radio-ti04-708hp.dts
          
      - name: Patch Makefiles for Custom Device
        run: |
          cd openwrt
          
          # Add device to target/linux/ipq40xx/image/generic.mk
          cat << 'EOF' >> target/linux/ipq40xx/image/generic.mk
          
          define Device/h1radio_ti04-708hp
          	$(call Device/FitImage)
          	DEVICE_VENDOR := H1Radio
          	DEVICE_MODEL := TI04-708HP
          	SOC := qcom-ipq4019
          	DEVICE_DTS := qcom-ipq4019-h1radio-ti04-708hp
          	BLOCKSIZE := 128k
          	PAGESIZE := 2048
          	IMAGE_SIZE := 32768k
          	DEVICE_PACKAGES := ipq-wifi-h1radio_ti04-708hp kmod-mtd-rw
          endef
          TARGET_DEVICES += h1radio_ti04-708hp
          EOF
          
      - name: Generate Custom Regulatory DB
        run: |
          git clone https://git.kernel.org/pub/scm/linux/kernel/git/sforshee/wireless-regdb.git
          cd wireless-regdb
          # Create a custom db.txt with 2.3 GHz and 5 GHz superchannels on US and 00
          cat << 'EOF' > db.txt
          country 00:
              (2300 - 2736 @ 40), (30)
              (5150 - 5350 @ 80), (30), AUTO-BW
              (5470 - 5850 @ 160), (30)
              (5850 - 5925 @ 80), (30)
          
          country US: DFS-FCC
              (2300 - 2736 @ 40), (30)
              (5150 - 5350 @ 80), (30), AUTO-BW
              (5470 - 5850 @ 160), (30)
              (5850 - 5925 @ 80), (30)
          EOF
          make
          cd ..

      - name: Inject Custom Board Data, Regulatory and UCI Defaults Setup
        run: |
          cd openwrt
          mkdir -p files/lib/firmware/ath10k/QCA4019/hw1.0/
          cp ../board-2.bin files/lib/firmware/ath10k/QCA4019/hw1.0/board-2.bin
          cp ../wireless-regdb/regulatory.db files/lib/firmware/regulatory.db
          # We must also include the public key in the firmware so the kernel can verify it, 
          # but OpenWrt usually handles this in the mac80211 package. 
          # To be safe, we disable regdb signature checking via kernel config later.
          cp -r ../files_ap/* files/
          chmod +x files/etc/uci-defaults/*
          
      - name: Update Feeds and Configure
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          cat << 'EOF' > .config
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_h1radio_ti04-708hp=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_ATH_USER_REGD=y
          CONFIG_PACKAGE_ATH_USER_REGD=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_MAC80211_USER_REGD=y
          CONFIG_KERNEL_CFG80211_REQUIRE_SIGNED_REGDB=n
          CONFIG_PACKAGE_wireless-regdb=y
          EOF
          
          make defconfig
          
      - name: Download Dependencies
        run: |
          cd openwrt
          make download -j8
          
      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc)
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H1Radio_TI04-708HP_SuperFirmware
          path: openwrt/bin/targets/ipq40xx/generic/*
