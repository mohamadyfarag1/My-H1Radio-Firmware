name: Build Custom OpenWrt for H1Radio TI04-708HP

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages to install (e.g., luci luci-app-wireguard)'
        required: false
        default: 'luci'

env:
  # Pin to a released tag for reproducible builds instead of a moving branch.
  OPENWRT_REF: 'v23.05.5'

jobs:
  build:
    name: Build OpenWrt (${{ matrix.role }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # ap  = AP-WDS firmware   (device that broadcasts / uplink side)
        # sta = Client-WDS firmware (device that joins the AP as a bridge)
        role: [ap, sta]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Setup Linux Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget device-tree-compiler python3-pip python3-m2crypto python3-cryptography swig libelf-dev

      - name: Clone OpenWrt Source
        run: |
          git clone --depth 1 -b "${OPENWRT_REF}" https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Generate Device Tree (DTS)
        run: |
          cd openwrt
          python3 << 'PYEOF'
          import os
          # NOTE: calibration-variant is now "H1Radio" so it MATCHES the entries
          # that actually exist inside the shipped board-2.bin. The old value
          # "8devices-Jalapeno" did not exist in the board file and only worked
          # by silently falling back to the bare board-id match.
          dts_content = '''// SPDX-License-Identifier: GPL-2.0-or-later OR MIT
          #include "qcom-ipq4019-ap.dk01.1-c1.dts"

          / {
              model = "H1Radio TI04-708HP";
              compatible = "h1radio,ti04-708hp", "qcom,ipq4019";
          };

          &wifi0 {
              status = "okay";
              qcom,ath10k-calibration-variant = "H1Radio";
          };

          &wifi1 {
              status = "okay";
              qcom,ath10k-calibration-variant = "H1Radio";
          };
          '''
          for d in ("target/linux/ipq40xx/files/arch/arm/boot/dts",
                    "target/linux/ipq40xx/dts"):
              os.makedirs(d, exist_ok=True)
              with open(f"{d}/qcom-ipq4019-h1radio-ti04-708hp.dts", "w") as f:
                  f.write(dts_content)
          print("DTS generated.")
          PYEOF

      - name: Patch Makefiles for Custom Device
        run: |
          cd openwrt
          {
            printf '\n'
            printf 'define Device/h1radio_ti04-708hp\n'
            printf '\t$(call Device/FitImage)\n'
            printf '\t$(call Device/UbiFit)\n'
            printf '\tDEVICE_VENDOR := H1Radio\n'
            printf '\tDEVICE_MODEL := TI04-708HP\n'
            printf '\tSOC := qcom-ipq4019\n'
            printf '\tDEVICE_DTS := qcom-ipq4019-h1radio-ti04-708hp\n'
            printf '\tBLOCKSIZE := 128k\n'
            printf '\tPAGESIZE := 2048\n'
            printf '\tIMAGE_SIZE := 32768k\n'
            printf '\tDEVICE_PACKAGES := kmod-ath10k ath10k-firmware-qca4019 -kmod-ath10k-ct -ath10k-firmware-qca4019-ct\n'
            printf 'endef\n'
            printf 'TARGET_DEVICES += h1radio_ti04-708hp\n'
          } >> target/linux/ipq40xx/image/generic.mk

      - name: Patch platform.sh for sysupgrade support
        run: |
          cd openwrt
          python3 << 'PYEOF'
          path = "target/linux/ipq40xx/base-files/lib/upgrade/platform.sh"
          with open(path) as f:
              content = f.read()
          if "h1radio,ti04-708hp" not in content:
              content = content.replace("wallys,dr40x9)",
                                        "h1radio,ti04-708hp |\\\n\twallys,dr40x9)")
              with open(path, "w") as f:
                  f.write(content)
              print("OK: h1radio added to platform.sh")
          else:
              print("already present")
          PYEOF

      - name: Build Custom Unlocked Regulatory DB
        run: |
          git clone https://git.kernel.org/pub/scm/linux/kernel/git/sforshee/wireless-regdb.git || true
          cd wireless-regdb
          python3 - << 'PYEOF'
          countries = ['00',
              'AD','AE','AF','AL','AM','AN','AR','AT','AU','AW','AZ',
              'BA','BB','BD','BE','BG','BH','BL','BN','BO','BR','BY',
              'CA','CF','CH','CI','CL','CN','CO','CR','CY','CZ',
              'DE','DK','DO','DZ','EC','EE','EG','ES','ET','FI','FR',
              'GB','GE','GH','GL','GP','GR','GT','GU','GY',
              'HK','HN','HR','HT','HU','ID','IE','IL','IN','IQ','IR','IS','IT',
              'JM','JO','JP','KE','KH','KN','KP','KR','KW','KY','KZ',
              'LB','LC','LI','LK','LS','LT','LU','LV',
              'MA','MC','MD','ME','MF','MH','MK','MN','MO','MP','MQ','MR','MT','MU','MW','MX','MY',
              'NG','NI','NL','NO','NP','NZ','OM',
              'PA','PE','PF','PG','PH','PK','PL','PM','PR','PT','PW','PY','QA',
              'RE','RO','RS','RU','RW','SA','SE','SG','SI','SK','SN','SR','SV','SY',
              'TC','TD','TG','TH','TN','TR','TT','TW','TZ',
              'UA','UG','US','UY','UZ','VC','VE','VI','VN','VU',
              'WF','WS','YE','YT','ZA','ZW']
          with open('db.txt', 'w') as f:
              for c in countries:
                  f.write(f'country {c}:\n')
                  f.write('\t(2192 - 2732 @ 40), (30)\n')
                  f.write('\t(4900 - 6100 @ 160), (30)\n\n')
          print(f'Generated db.txt with {len(countries)} countries')
          PYEOF
          openssl ecparam -name prime256v1 -genkey -noout -out key.priv.pem
          make || echo "WARNING: regulatory.db build failed, will use repo copy"

      - name: Inject Board Data, Regulatory DB and Overlay Files
        run: |
          cd openwrt
          mkdir -p files/lib/firmware/ath10k/QCA4019/hw1.0/
          cp ../board-2.bin files/lib/firmware/ath10k/QCA4019/hw1.0/board-2.bin

          mkdir -p files/lib/firmware
          if [ -f ../wireless-regdb/regulatory.db ]; then
            cp ../wireless-regdb/regulatory.db files/lib/firmware/regulatory.db
            echo "Using freshly built regulatory.db"
          elif [ -f ../regulatory.db ]; then
            cp ../regulatory.db files/lib/firmware/regulatory.db
            echo "Using repo regulatory.db"
          fi

          # Overlay for THIS role (ap or sta). All tracked files.
          cp -r ../files_${{ matrix.role }}/* files/
          find files/etc/uci-defaults files/etc/init.d files/usr/bin files/usr/sbin -type f -exec chmod +x {} \; 2>/dev/null || true

      - name: Update Feeds and Configure
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Avoid the ath10k-ct vs ath10k clash on ipq40xx
          sed -i 's/kmod-ath10k-ct/kmod-ath10k/g' target/linux/ipq40xx/Makefile
          sed -i 's/ath10k-firmware-qca4019-ct/ath10k-firmware-qca4019/g' target/linux/ipq40xx/Makefile

          cat > .config << 'CFGEOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_h1radio_ti04-708hp=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_PACKAGE_kmod-ath10k=y
          CONFIG_PACKAGE_ath10k-firmware-qca4019=y
          # CONFIG_PACKAGE_kmod-ath10k-ct is not set
          # CONFIG_PACKAGE_ath10k-firmware-qca4019-ct is not set
          # Make ath drivers respect the user's regdomain (the clean unlock switch)
          CONFIG_ATH_USER_REGD=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_KERNEL_CFG80211_REQUIRE_SIGNED_REGDB=n
          CONFIG_KERNEL_CFG80211_CERTIFICATION_ONUS=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_tcpdump-mini=y
          CONFIG_PACKAGE_ip-full=y
          CFGEOF
          make defconfig

      - name: Download Dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Prepare mac80211 source, then apply Superchannel patches
        run: |
          cd openwrt
          # Extract the backports (cfg80211 / mac80211 / ath) into build_dir.
          # This also builds the toolchain as a dependency.
          make -j$(nproc) package/kernel/mac80211/prepare V=s
          # Patch the freshly extracted sources IN build_dir (the whole point).
          bash ../scripts/unlock-superchannel.sh

      - name: Prepare hostapd source, then apply Superchannel patches
        run: |
          cd openwrt
          make -j$(nproc) package/network/services/hostapd/prepare V=s
          bash ../scripts/unlock-superchannel.sh

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H1Radio_TI04-708HP_${{ matrix.role }}
          path: openwrt/bin/targets/ipq40xx/generic/*
