name: Build Custom OpenWrt for H1Radio TI04-708HP

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages to install (e.g., luci luci-app-wireguard)'
        required: false
        default: 'luci'

jobs:
  build:
    name: Build OpenWrt
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Linux Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget device-tree-compiler
            
      - name: Clone OpenWrt Source
        run: |
          git clone -b openwrt-23.05 https://git.openwrt.org/openwrt/openwrt.git openwrt
          
      - name: Decompile and Inject Device Tree
        run: |
          cd openwrt
          dtc -I dtb -O dts ../router.dtb > target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-h1radio-ti04-708hp.dts
          
      - name: Patch Makefiles for Custom Device
        run: |
          cd openwrt
          
          # Add device to target/linux/ipq40xx/image/generic.mk
          cat << 'EOF' >> target/linux/ipq40xx/image/generic.mk
          
          define Device/h1radio_ti04-708hp
          	$(call Device/FitImage)
          	DEVICE_VENDOR := H1Radio
          	DEVICE_MODEL := TI04-708HP
          	SOC := qcom-ipq4019
          	DEVICE_DTS := qcom-ipq4019-h1radio-ti04-708hp
          	BLOCKSIZE := 128k
          	PAGESIZE := 2048
          	IMAGE_SIZE := 32768k
          	DEVICE_PACKAGES := ipq-wifi-h1radio_ti04-708hp kmod-mtd-rw
          endef
          TARGET_DEVICES += h1radio_ti04-708hp
          EOF
          
      - name: Inject 2.3GHz Kernel Patch (cfg80211/ath10k)
        run: |
          cd openwrt
          mkdir -p package/kernel/mac80211/patches/build
          
          # 1. Patch reg.c to allow 2.3 GHz in cfg80211
          cat << 'EOF' > package/kernel/mac80211/patches/build/999-unlock-2.3ghz.patch
          --- a/net/wireless/reg.c
          +++ b/net/wireless/reg.c
          @@ -2994,7 +2994,7 @@ bool regulatory_is_valid_freq(struct wiphy *wiphy, enum nl80211_band band,
           		if (freq == wiphy->bands[band]->channels[i].center_freq)
           			return true;
           	}
          -	return false;
          +	return true;
           }
           EXPORT_SYMBOL(regulatory_is_valid_freq);
           
          EOF
          
      - name: Inject Custom Board Data and Regulatory
        run: |
          cd openwrt
          mkdir -p files/lib/firmware/ath10k/QCA4019/hw1.0/
          cp ../board-2.bin files/lib/firmware/ath10k/QCA4019/hw1.0/board-2.bin
          cp ../regulatory.db files/lib/firmware/regulatory.db
          
      - name: Update Feeds and Configure
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          cat << 'EOF' > .config
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_h1radio_ti04-708hp=y
          CONFIG_PACKAGE_luci=y
          EOF
          
          make defconfig
          
      - name: Download Dependencies
        run: |
          cd openwrt
          make download -j8
          
      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc)
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: H1Radio_TI04-708HP_SuperFirmware
          path: openwrt/bin/targets/ipq40xx/generic/*sysupgrade.bin
