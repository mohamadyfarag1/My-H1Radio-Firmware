name: Build Custom OpenWrt for H1Radio TI04-708HP

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Extra packages to install (e.g., luci luci-app-wireguard)'
        required: false
        default: 'luci'

jobs:
  build:
    name: Build OpenWrt
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Linux Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools rsync unzip zlib1g-dev \
            file wget device-tree-compiler python3-pip python3-m2crypto swig libelf-dev

      - name: Clone OpenWrt Source
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Decompile and Inject Device Tree
        run: |
          cd openwrt
          # Decompile router.dtb to DTS source
          dtc -I dtb -O dts -s ../router.dtb > /tmp/h1radio.dts

          # Place DTS in ALL possible locations OpenWrt may look for it
          # Location 1: files overlay (for custom devices)
          mkdir -p target/linux/ipq40xx/files/arch/arm/boot/dts
          cp /tmp/h1radio.dts target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-h1radio-ti04-708hp.dts

          # Location 2: The main DTS directory used by ipq40xx target
          mkdir -p target/linux/ipq40xx/dts
          cp /tmp/h1radio.dts target/linux/ipq40xx/dts/qcom-ipq4019-h1radio-ti04-708hp.dts

          echo "DTS injected into all locations"

      - name: Patch Makefiles for Custom Device
        run: |
          cd openwrt
          {
            printf '\n'
            printf 'define Device/h1radio_ti04-708hp\n'
            printf '\t$(call Device/FitImage)\n'
            printf '\t$(call Device/UbiFit)\n'
            printf '\tDEVICE_VENDOR := H1Radio\n'
            printf '\tDEVICE_MODEL := TI04-708HP\n'
            printf '\tSOC := qcom-ipq4019\n'
            printf '\tDEVICE_DTS := qcom-ipq4019-h1radio-ti04-708hp\n'
            printf '\tBLOCKSIZE := 128k\n'
            printf '\tPAGESIZE := 2048\n'
            printf '\tIMAGE_SIZE := 32768k\n'
            printf '\tDEVICE_PACKAGES := kmod-ath10k-ct ath10k-firmware-qca4019-ct\n'
            printf 'endef\n'
            printf 'TARGET_DEVICES += h1radio_ti04-708hp\n'
          } >> target/linux/ipq40xx/image/generic.mk

      - name: Patch platform.sh for sysupgrade support
        run: |
          cd openwrt
          PLATFORM_SH="target/linux/ipq40xx/base-files/lib/upgrade/platform.sh"
          # Add our device to the nand_do_upgrade list in platform_do_upgrade()
          sed -i '/wallys,dr40x9)/a\	h1radio,ti04-708hp |\\' "$PLATFORM_SH"
          echo "=== platform.sh patched: h1radio added to nand_do_upgrade ==="
          grep -A 2 'h1radio' "$PLATFORM_SH" || true

      - name: Create Superchannel Unlock Script
        run: |
          cat > /tmp/unlock-superchannel.sh << 'SEDSCRIPT'
          #!/bin/bash
          echo "============================================"
          echo "=== SUPERCHANNEL UNLOCK - Full Spectrum ==="
          echo "============================================"

          #############################################
          # PATCH 1: ath/regd.c (Kernel Regulatory)
          # Based on forum post #3 by anarchy99
          # Expands 2GHz to 2192-2732 MHz
          # Expands 5GHz to 4900-6100 MHz
          # Removes NO_IR and NO_OFDM restrictions
          #############################################
          for REGD in $(find . -path "*/drivers/net/wireless/ath/regd.c" 2>/dev/null); do
            echo "[PATCH 1] Patching: $REGD"
            # 2GHz CH01-11 rule: expand to full 2.3GHz band
            sed -i 's/REG_RULE(2412-10, 2462+10, 40, 0, 20, 0)/REG_RULE(2192-10, 2732+10, 40, 0, 30, 0)/g' "$REGD"
            # 2GHz CH12-13 rule: expand to full band
            sed -i 's/REG_RULE(2467-10, 2472+10, 40, 0, 20,/REG_RULE(2192-10, 2732+10, 40, 0, 30,/g' "$REGD"
            # 2GHz CH14 rule: increase power
            sed -i 's/REG_RULE(2484-10, 2484+10, 40, 0, 20,/REG_RULE(2484-10, 2484+10, 40, 0, 30,/g' "$REGD"
            # 5GHz first range: expand to full 5GHz
            sed -i 's/REG_RULE(5150-10, 5350+10, 80, 0, 30,/REG_RULE(4900-10, 6100+10, 160, 0, 30,/g' "$REGD"
            # 5GHz second range: expand to full 5GHz
            sed -i 's/REG_RULE(5470-10, 5850+10, 80, 0, 30,/REG_RULE(4900-10, 6100+10, 160, 0, 30,/g' "$REGD"
            # 5GHz third range: expand to full 5GHz
            sed -i 's/REG_RULE(5725-10, 5850+10, 80, 0, 30,/REG_RULE(4900-10, 6100+10, 160, 0, 30,/g' "$REGD"
            # Remove NO_IR (No Initiate Radiation) - allow active scan
            sed -i 's/NL80211_RRF_NO_IR/0/g' "$REGD"
            # Remove NO_OFDM restriction - allow OFDM on all channels
            sed -i 's/NL80211_RRF_NO_OFDM/0/g' "$REGD"
            echo "  -> ath/regd.c patched OK"
          done

          #############################################
          # PATCH 2: net/wireless/reg.c
          # Based on forum post #3
          # Expands world regdomain 00
          # Removes is_valid_rd() checks completely
          #############################################
          for REG in $(find . -path "*/net/wireless/reg.c" 2>/dev/null); do
            echo "[PATCH 2] Patching: $REG"
            # Expand world regdomain 00 - 2GHz
            sed -i 's/REG_RULE(2412-10, 2462+10, 40, 6, 20, 0)/REG_RULE(2192-10, 2732+10, 40, 6, 30, 0)/g' "$REG"
            # Remove CH12-13 separate rule (now covered by expanded range)
            sed -i 's/REG_RULE(2467-10, 2472+10, 20, 6, 20,/REG_RULE(2192-10, 2732+10, 40, 6, 30,/g' "$REG"
            # Expand CH14 power
            sed -i 's/REG_RULE(2484-10, 2484+10, 20, 6, 20,/REG_RULE(2484-10, 2484+10, 40, 6, 30,/g' "$REG"
            # Remove ALL is_valid_rd() validation blocks (3 locations in the forum patch)
            # Location 1: reg_set_rd_user
            sed -i '/if (!is_valid_rd(rd)) {/{N;N;N;N;d}' "$REG"
            # Location 2: WARN version
            sed -i '/if (WARN(!is_valid_rd(rd)/{N;N;N;d}' "$REG"
            # Remove NO_IR flags from world regdomain
            sed -i 's/NL80211_RRF_NO_IR | NL80211_RRF_AUTO_BW/0/g' "$REG"
            sed -i 's/NL80211_RRF_NO_IR/0/g' "$REG"
            sed -i 's/NL80211_RRF_NO_OFDM/0/g' "$REG"
            echo "  -> net/wireless/reg.c patched OK"
          done

          #############################################
          # PATCH 3: net/wireless/util.c
          # CRITICAL for 2.3GHz support!
          # Adds support for channel numbers > 127
          # Without this, extended channels won't work
          #############################################
          for UTIL in $(find . -path "*/net/wireless/util.c" 2>/dev/null); do
            echo "[PATCH 3] Patching: $UTIL"
            # Add signed char cast for extended channel numbers
            # This allows channels 213-255 (2.3GHz band) to work
            sed -i '/case NL80211_BAND_2GHZ:/a\\t\tchan = (int)(char)chan;' "$UTIL"
            echo "  -> net/wireless/util.c patched OK"
          done

          #############################################
          # PATCH 4: hostapd - hw_features.c
          # Allow OFDM/HT/VHT on channel 14
          # Without this, channel 14 is B-only
          #############################################
          for HWF in $(find . -path "*/hostapd*/src/ap/hw_features.c" -o -path "*/wpad*/src/ap/hw_features.c" 2>/dev/null); do
            echo "[PATCH 4] Patching: $HWF"
            # Remove the block that disables OFDM/HT/VHT on channel 14
            sed -i 's/wpa_printf(MSG_INFO, "Disable OFDM\/HT\/VHT on channel 14");//g' "$HWF"
            sed -i 's/iface->conf->hw_mode = HOSTAPD_MODE_IEEE80211B;/iface->conf->hw_mode = HOSTAPD_MODE_IEEE80211G;/g' "$HWF"
            sed -i '/iface->conf->ieee80211n = 0;/d' "$HWF"
            sed -i '/iface->conf->ieee80211ac = 0;/d' "$HWF"
            echo "  -> hostapd/hw_features.c patched OK"
          done

          echo "============================================"
          echo "=== SUPERCHANNEL UNLOCK COMPLETE ==="
          echo "============================================"
          SEDSCRIPT
          chmod +x /tmp/unlock-superchannel.sh

      - name: Generate Custom Unlocked Regulatory DB
        run: |
          git clone https://git.kernel.org/pub/scm/linux/kernel/git/sforshee/wireless-regdb.git || true
          cd wireless-regdb
          python3 -c "
          # Generate db.txt with ALL countries unlocked
          countries = [
              '00',
              'AD','AE','AF','AL','AM','AN','AR','AT','AU','AW','AZ',
              'BA','BB','BD','BE','BG','BH','BL','BN','BO','BR','BY',
              'CA','CF','CH','CI','CL','CN','CO','CR','CY','CZ',
              'DE','DK','DO','DZ',
              'EC','EE','EG','ES','ET',
              'FI','FR',
              'GB','GE','GH','GL','GP','GR','GT','GU','GY',
              'HK','HN','HR','HT','HU',
              'ID','IE','IL','IN','IQ','IR','IS','IT',
              'JM','JO','JP',
              'KE','KH','KN','KP','KR','KW','KY','KZ',
              'LB','LC','LI','LK','LS','LT','LU','LV',
              'MA','MC','MD','ME','MF','MH','MK','MN','MO','MP','MQ','MR','MT','MU','MW','MX','MY',
              'NG','NI','NL','NO','NP','NZ',
              'OM',
              'PA','PE','PF','PG','PH','PK','PL','PM','PR','PT','PW','PY',
              'QA',
              'RE','RO','RS','RU','RW',
              'SA','SE','SG','SI','SK','SN','SR','SV','SY',
              'TC','TD','TG','TH','TN','TR','TT','TW','TZ',
              'UA','UG','US','UY','UZ',
              'VC','VE','VI','VN','VU',
              'WF','WS',
              'YE','YT',
              'ZA','ZW'
          ]
          with open('db.txt', 'w') as f:
              for c in countries:
                  if c == '00':
                      f.write('country 00:\n')
                  else:
                      f.write(f'country {c}:\n')
                  f.write('\t(2192 - 2732 @ 40), (30)\n')
                  f.write('\t(2484 - 2484 @ 40), (30)\n')
                  f.write('\t(4900 - 6100 @ 160), (30)\n')
                  f.write('\n')
          print(f'Generated db.txt with {len(countries)} countries')
          "
          openssl ecparam -name prime256v1 -genkey -noout -out key.priv.pem
          make || echo "WARNING: regulatory.db build failed, using repo copy"

      - name: Inject Custom Board Data and Regulatory and UCI Defaults
        run: |
          cd openwrt
          mkdir -p files/lib/firmware/ath10k/QCA4019/hw1.0/
          cp ../board-2.bin files/lib/firmware/ath10k/QCA4019/hw1.0/board-2.bin
          if [ -f ../wireless-regdb/regulatory.db ]; then
            cp ../wireless-regdb/regulatory.db files/lib/firmware/regulatory.db
            echo "Using freshly built regulatory.db"
          elif [ -f ../regulatory.db ]; then
            cp ../regulatory.db files/lib/firmware/regulatory.db
            echo "Using existing regulatory.db from repo"
          fi
          cp -r ../files_ap/* files/
          chmod +x files/etc/uci-defaults/*

          # ============================================
          # Passive ARP Sniffer (UBNT-like IP+Host discovery)
          # ============================================
          mkdir -p files/usr/bin
          cat > files/usr/bin/passive-ip-sniffer.sh << 'SNIFFEREOF'
#!/bin/sh
# Passive ARP Sniffer - Discovers IP and Hostname of wireless stations
# Works on Bridge Mode APs with DHCP disabled
# Mimics UBNT-style station info discovery

LEASES="/tmp/dhcp.leases"
CACHE="/tmp/.arp-sniffer-cache"

sleep 15
touch "$CACHE" "$LEASES"

tcpdump -i br-lan -l -n -e -t arp 2>/dev/null | awk '
{
    mac = ""; ip = ""
    if ($9 == "Request" && $12 == "tell") {
        mac = $1; ip = $13; sub(/,$/, "", ip)
    } else if ($9 == "Reply" && $11 == "is-at") {
        mac = $1; ip = $10
    }
    if (mac != "" && ip != "") {
        print mac " " ip
        fflush()
    }
}' | while read mac ip; do
    # Skip if already cached
    grep -q "$mac $ip" "$CACHE" 2>/dev/null && continue

    # Inject IP into kernel neighbor table
    ip neigh replace "$ip" dev br-lan lladdr "$mac" nud reachable 2>/dev/null

    # Try reverse DNS for hostname
    hostname=$(nslookup "$ip" 2>/dev/null | sed -n 's/.*name = \(.*\)/\1/p' | sed 's/\.$//' | head -1)

    # If no reverse DNS, try reading HTTP title from device web UI
    if [ -z "$hostname" ]; then
        hostname=$(wget -qO- -T 2 "http://$ip/" 2>/dev/null | sed -n 's/.*<title>\([^<]*\)<\/title>.*/\1/ip' | head -1)
    fi

    # Fallback: use IP as hostname
    [ -z "$hostname" ] && hostname="$ip"

    # Update cache
    sed -i "/$mac/d" "$CACHE" 2>/dev/null
    echo "$mac $ip $hostname" >> "$CACHE"

    # Write to DHCP leases file (LuCI reads this for Host column)
    sed -i "/$mac/d" "$LEASES" 2>/dev/null
    echo "0 $mac $ip $hostname *" >> "$LEASES"
done
SNIFFEREOF
          chmod +x files/usr/bin/passive-ip-sniffer.sh

          # Init.d service for auto-start
          mkdir -p files/etc/init.d
          cat > files/etc/init.d/passive-arp << 'INITEOF'
#!/bin/sh /etc/rc.common
START=99
USE_PROCD=1
PROG=/usr/bin/passive-ip-sniffer.sh
start_service() {
    procd_open_instance
    procd_set_param command "$PROG"
    procd_set_param respawn 3600 5 0
    procd_close_instance
}
INITEOF
          chmod +x files/etc/init.d/passive-arp

          # Auto-enable the service on first boot
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-enable-passive-arp << 'UCIEOF'
#!/bin/sh
/etc/init.d/passive-arp enable
exit 0
UCIEOF
          chmod +x files/etc/uci-defaults/99-enable-passive-arp

          # Create helper script to extract real EEPROM calibration data after first boot
          mkdir -p files/usr/sbin
          cat > files/usr/sbin/extract-board-data << 'EXTRACTEOF'
          #!/bin/sh
          # Run this script via SSH after first boot to extract
          # the real calibration data from your device's flash
          echo "=== H1Radio Board Data Extractor ==="

          # Find the ART (calibration) partition
          ART_MTD=$(grep -i "art\|caldata\|radio\|0:ART" /proc/mtd | head -1 | cut -d: -f1)
          if [ -z "$ART_MTD" ]; then
            echo "ERROR: Could not find calibration partition!"
            echo "Available partitions:"
            cat /proc/mtd
            exit 1
          fi

          echo "Found calibration partition: /dev/$ART_MTD"
          dd if=/dev/$ART_MTD of=/tmp/art_backup.bin 2>/dev/null
          echo "Calibration data saved to /tmp/art_backup.bin"
          echo "Size: $(wc -c < /tmp/art_backup.bin) bytes"
          echo ""
          echo "To download it to your PC, use:"
          echo "  scp root@192.168.1.1:/tmp/art_backup.bin ."
          echo ""
          echo "=== Done ==="
          EXTRACTEOF
          chmod +x files/usr/sbin/extract-board-data

      - name: Update Feeds and Configure
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config << 'CFGEOF'
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_h1radio_ti04-708hp=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_irqbalance=y
          CONFIG_PACKAGE_luci-app-irqbalance=y
          CONFIG_PACKAGE_kmod-ath=y
          CONFIG_ATH_USER_REGD=y
          CONFIG_PACKAGE_ATH_USER_REGD=y
          CONFIG_PACKAGE_kmod-mac80211=y
          CONFIG_MAC80211_USER_REGD=y
          CONFIG_KERNEL_CFG80211_REQUIRE_SIGNED_REGDB=n
          CONFIG_KERNEL_CFG80211_CERTIFICATION_ONUS=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_tcpdump-mini=y
          CONFIG_PACKAGE_ip-full=y
          CFGEOF
          make defconfig

      - name: Download Dependencies
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware with Superchannel Patches
        run: |
          cd openwrt
          echo "======================================="
          echo "Step 1: Preparing kernel source..."
          echo "======================================="
          make target/linux/prepare V=s -j$(nproc) 2>&1 || true

          echo "======================================="
          echo "Step 1.5: Injecting DTS into kernel build tree..."
          echo "======================================="
          # Find the actual kernel build directory and inject DTS there
          for dts_dir in $(find build_dir -type d -name "dts" -path "*/arch/arm/boot/dts" 2>/dev/null); do
            echo "Copying DTS to: $dts_dir"
            cp /tmp/h1radio.dts "$dts_dir/qcom-ipq4019-h1radio-ti04-708hp.dts"
          done
          # Also search for any qcom dts directory
          for dts_dir in $(find build_dir -type d -name "dts" -path "*/boot/dts" 2>/dev/null); do
            echo "Copying DTS to: $dts_dir"
            cp /tmp/h1radio.dts "$dts_dir/qcom-ipq4019-h1radio-ti04-708hp.dts" 2>/dev/null || true
          done

          echo "======================================="
          echo "Step 2: Applying Superchannel Patches..."
          echo "======================================="
          cd build_dir
          bash /tmp/unlock-superchannel.sh
          cd ..

          echo "======================================="
          echo "Step 3: Starting Full Compilation..."
          echo "======================================="
          make -j$(nproc) || make -j1 V=s

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: H1Radio_TI04-708HP_SuperFirmware
          path: openwrt/bin/targets/ipq40xx/generic/*
